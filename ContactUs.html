<!DOCTYPE html>
<html>
	<head>
		<title>Gaming Website</title>
		<link rel = "stylesheet" type = "text/css" href = "style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
		<a href="#" class="to-top">▲</a>
		<style>
			body{
				font-family: "Press Start 2P";
			}
		</style>
	</head>
	
	<body>
		<header>
			<h1>Contact Us</h1>
		</header>
	
		<nav>
			<a href = "index.html">Home</a>
			<a href = "AboutUs.html">About Us</a>
			<a href = "ContactUs.html">Contact Us</a>
			<a href = "Gallery.html">Gallery</a>
		</nav>
		
		<main>

		<div class="contact-box">
		<h2>Contact Us</h2>
		<p>
		Have a question, a suggestion, or a favorite game you want us to feature?
		Send us a message and Pixel Squad will read it.
		</p>

		<form id="contactForm" onsubmit="return sendMessage(event)">
		<label for="name">Name</label>
		<input type="text" id="name" name="name" placeholder="Your name" required>
	
		<label for="email">Email Address</label>
		<input type="email" id="email" name="email" placeholder="you@example.com" required>

		<label for="subject">Subject</label>
		<input type="text" id="subject" name="subject" placeholder="What is this about?" required>
	
		<label for="message">Message</label>
		<textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

		<button type="submit">Submit</button>
		</form>

		<p id="thankYou" class="thank-you"></p>
		</div>

		</main>

		<script>
		function sendMessage(event) {
		event.preventDefault();
		var name = document.getElementById("name").value;
		document.getElementById("thankYou").textContent =
		"Thank you, " + name + "! Your message has been sent.";
		document.getElementById("contactForm").reset();
		return false;
		}
		</script>
	
	
	</body>
	
</html>
